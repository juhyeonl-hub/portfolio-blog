spring:
  # Keep JsonNode request/response and stored settings compatible during the platform upgrade.
  http:
    converters:
      preferred-json-mapper: jackson2
  websocket:
    messaging:
      preferred-json-mapper: jackson2
  application:
    name: portfolio-blog

  profiles:
    default: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: none # ClientAddress trusts only the authenticated ASBC proxy headers.
