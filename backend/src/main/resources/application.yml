spring:
  # Jackson 3 with explicit legacy JSON shapes for existing stored settings and API clients.
  http:
    converters:
      preferred-json-mapper: jackson
  websocket:
    messaging:
      preferred-json-mapper: jackson
  jackson:
    use-jackson2-defaults: true
  application:
    name: portfolio-blog

  profiles:
    default: prod

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: none # ClientAddress trusts only the authenticated ASBC proxy headers.
